<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地知识库 · 3D 脑图</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>本地知识库 · 3D 脑图</h1>
    <div id="stats">加载中…</div>
  </div>
  <div class="controls">
    <button id="refreshBtn" class="warm">更新索引</button>
    <button id="rotateBtn">暂停旋转</button>
    <button id="minimalBtn" title="极简模式：纯点+细环，无珠体光晕">极简</button>
    <button id="organizeBtn" class="primary">整理</button>
    <button id="cleanupBtn" class="warm">清理空间</button>
    <button id="assistantToggle">助手</button>
    <button id="fullscreenBtn">全屏</button>
  </div>
</header>
<main>
  <aside class="chat">
    <div class="chat-head" id="assistantHead">
      <strong>知识库助手</strong>
      <span class="muted">拖动标题移动</span>
      <div class="win-tools">
        <button id="assistantSettings" class="text" title="设置助手信息">设置</button>
        <button id="assistantClear" class="text" title="清空对话">清空</button>
        <button id="assistantDock" title="靠左停靠">⇤</button>
        <button id="assistantMin" title="收起/展开">—</button>
        <button id="assistantHide" title="关闭">×</button>
      </div>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="quick">
      <button data-quick="推荐删除">推荐删除</button>
      <button data-quick="推荐整理">推荐整理</button>
      <button data-quick="列出推荐删除的明细">删除明细</button>
    </div>
    <div class="chat-input">
      <input id="chatInput" type="search" placeholder="搜索文件，或直接提问 / 输入推荐删除…">
      <button id="chatSend" class="primary">发送</button>
    </div>
    <div class="chat-resize" id="assistantResize" title="拖动缩放"></div>
  </aside>
  <section id="stage">
    <canvas id="canvas"></canvas>
    <div id="loading">
      <div class="loading-box">
        <div id="loadingText">正在读取知识库索引…</div>
        <div class="progress"><div id="progressBar"></div></div>
        <div id="loadingPercent">0%</div>
      </div>
    </div>
    <div id="selfcheckBadge" title="系统自检">自检 读取中…</div>
    <div id="mapSearch">
      <input id="mapSearchInput" type="search" placeholder="搜索文件 / 标签，回车定位…" autocomplete="off">
      <div id="mapSearchDrop" hidden></div>
    </div>
    <button id="focusBack" class="focus-back" hidden>← 返回全景</button>
    <div id="tooltip"></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="legend" title="点击图例聚焦分类，悬停高亮"></div>
  </section>
</main>

<div id="detailWin" class="floatwin" hidden>
  <div class="float-head" id="detailHead">
    <strong id="detailTitle">文件详情</strong>
    <span class="muted">拖动标题移动</span>
    <button id="detailClose" class="win-close" title="关闭">×</button>
  </div>
  <div class="float-body" id="detailBody"></div>
</div>

<div id="organizeWin" class="floatwin" hidden>
  <div class="float-head" id="organizeHead">
    <strong>整理文件夹</strong>
    <span class="muted">先计划再执行</span>
    <button id="organizeClose" class="win-close" title="关闭">×</button>
  </div>
  <div class="float-body">
    <div class="org-form">
      <label>要整理的目录
        <input id="orgPath" type="search" placeholder="例如 ~/Pictures 或 /某个目录">
      </label>
      <label>整理方式
        <select id="orgStrategy">
          <option value="image">图片归类（OpenCV）</option>
          <option value="type">按文件类型</option>
          <option value="date">按修改月份</option>
          <option value="content">按内容规则</option>
        </select>
      </label>
      <div class="org-suggest-head"><span>推荐文件夹</span><span id="orgSuggestCount"></span></div>
      <div id="orgSuggestions" class="org-suggest"></div>
      <label class="opt"><input type="checkbox" id="orgRecursive"> 包含子目录</label>
      <div class="org-actions">
        <button id="orgPlanBtn" class="primary">生成计划</button>
        <button id="orgApplyBtn" disabled>执行</button>
        <button id="orgUndoBtn" disabled>撤销</button>
      </div>
      <div class="hint">目录必须在索引范围内。图片只处理 jpg/jpeg/png/bmp/webp/tif/tiff，先出计划再执行，可撤销。</div>
    </div>
    <div id="orgResult"></div>
  </div>
</div>

<div id="cleanWin" class="floatwin" hidden>
  <div class="float-head" id="cleanHead">
    <strong>清理空间</strong>
    <span class="muted">移到废纸篓，可恢复</span>
    <button id="cleanClose" class="win-close" title="关闭">×</button>
  </div>
  <div class="float-body" id="cleanBody"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
