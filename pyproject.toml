[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-kb"
version = "0.1.0"
description = "Portable local file knowledge base with an MCP interface"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3.0,<3",
  "numpy>=1.26",
  "watchdog>=4.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.2.7"]
feishu = ["lark-oapi>=1.7.0"]
tray = ["rumps>=0.4; sys_platform == 'darwin'"]
vision = ["opencv-python-headless>=4.8"]
docs = [
  "pypdf>=4.0",
  "python-docx>=1.0",
  "openpyxl>=3.1",
  "python-pptx>=0.6",
]
dev = ["pytest>=8.0"]

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["map_web/*.html", "map_web/css/*.css", "map_web/js/*.js"]
